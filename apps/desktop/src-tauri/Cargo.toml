[package]
name = "viable-desktop"
version = "0.1.0"
description = "Local-first marketability operating system by MythologIQ Labs, LLC"
authors = ["MythologIQ Labs, LLC"]
license = "Apache-2.0"
repository = "https://github.com/MythologIQ-Labs-LLC/Viable"
edition = "2021"
rust-version = "1.88"

[lib]
name = "viable_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
