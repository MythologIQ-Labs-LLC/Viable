[package]
name = "viable-desktop"
version = "0.1.0"
description = "Local-first marketability operating system by MythologIQ Labs, LLC"
authors = ["MythologIQ Labs, LLC"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "viable_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
