name: Credential Lock

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".github/workflows/credential-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88.0"
      - name: Generate authoritative Cargo lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current"
          else
            git commit -m "build: refresh Cargo lock for native credential stores"
            git push origin HEAD:${{ github.head_ref }}
          fi
