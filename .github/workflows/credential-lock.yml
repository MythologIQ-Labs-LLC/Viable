name: Credential Lock

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".github/workflows/credential-lock.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88.0"
      - name: Generate authoritative Cargo lockfile
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Upload Cargo lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credential-cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
