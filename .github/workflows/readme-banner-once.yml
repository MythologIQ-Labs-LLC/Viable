name: Apply README brand banner

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/readme-banner-once.yml"

permissions:
  contents: write

jobs:
  patch-readme:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Knapp-Kevin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Insert canonical Viable banner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          image = 'assets/brand/viable-banner.png'
          if image in text:
              print('Banner already present.')
              raise SystemExit(0)
          marker = '<div align="center">\n\n'
          banner = '<p align="center">\n  <img src="assets/brand/viable-banner.png" alt="Viable — Local Intelligence. Real Opportunities. Tangible Impact." width="100%">\n</p>\n\n'
          if marker not in text:
              raise SystemExit('README center header marker not found')
          path.write_text(text.replace(marker, marker + banner, 1))
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Show canonical Viable banner in README"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
