name: Temporary credential vault lock repair

on:
  push:
    branches:
      - feature/native-credential-vault-slice-c

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0

      - name: Restore proven lock baseline
        run: |
          git fetch origin main
          git show origin/main:apps/desktop/src-tauri/Cargo.lock > apps/desktop/src-tauri/Cargo.lock

      - name: Resolve only the new credential dependency closure
        run: |
          cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml -p aes --precise 0.9.2

      - name: Verify critical versions
        run: |
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml -p tauri --depth 0
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml -p tauri-build --depth 0
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml -p aes --depth 0

      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git diff --cached --quiet && exit 1
          git commit -m "Repair credential vault lockfile for Rust 1.88"
          git push origin HEAD:feature/native-credential-vault-slice-c
