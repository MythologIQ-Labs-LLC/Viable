name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/clean-build.mjs"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/clean-build.mjs"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write
  checks: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - name: Regenerate minimized Cargo lockfile
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Persist Cargo-generated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Knapp-Kevin'
        run: |
          lock_path="apps/desktop/src-tauri/Cargo.lock"
          if git diff --quiet -- "$lock_path"; then
            echo "Cargo.lock is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$lock_path"
            git commit -m "Regenerate Cargo.lock after native dependency cleanup"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Capture minimized dependency graph
        run: cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml > native-tree-after.txt
      - name: Upload Cargo-generated dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-dependency-after
          path: |
            apps/desktop/src-tauri/Cargo.lock
            native-tree-after.txt
          if-no-files-found: error
          retention-days: 7
      - name: Audit Rust dependencies
        uses: step-security/audit-check@7fa8c70774cb92a75b0e99b7774c310b0f859b91 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/desktop/src-tauri
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: npm ci
      - run: npm run desktop:bundle
      - name: Validate Debian package
        run: |
          package="$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
