# One-shot security remediation for #180.
# This workflow deletes itself in the Cargo-generated lockfile commit.
# Do not reuse as a general write-capable CI workflow.
name: One-shot RustSec lockfile regeneration 180
on:
  push:
    branches:
      - security/180-rustsec-patch-20261028
    paths:
      - .github/workflows/one-shot-180-cargo-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'MythologIQ-Labs-LLC/Viable' && github.ref == 'refs/heads/security/180-rustsec-patch-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88.0"
      - name: Regenerate narrowly with Cargo, never edit Cargo.lock directly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "security/180-rustsec-patch-20261028"
          test "$(git status --porcelain | wc -l)" -eq 0
          git merge-base --is-ancestor "f2abed27ca73ac100dfbfdf7ef823311af5ef05e" HEAD
          test "$(git rev-list --count f2abed27ca73ac100dfbfdf7ef823311af5ef05e..HEAD)" -le 2
          manifest="apps/desktop/src-tauri/Cargo.toml"
          cargo --version
          cargo update --manifest-path "$manifest" -p ctutils --precise 0.4.4
          cargo update --manifest-path "$manifest" -p rustls --precise 0.23.46
          cargo update --manifest-path "$manifest" -p rustls-webpki --precise 0.103.16
          python3 - <<'PY'
          import pathlib, tomllib
          lock_path = pathlib.Path("apps/desktop/src-tauri/Cargo.lock")
          data = tomllib.loads(lock_path.read_text())
          packages = {p["name"]: p["version"] for p in data["package"]}
          expected = {"ctutils": "0.4.4", "rustls": "0.23.46", "rustls-webpki": "0.103.16"}
          for name, version in expected.items():
              assert packages.get(name) == version, (name, packages.get(name), version)
          manifest = pathlib.Path("apps/desktop/src-tauri/Cargo.toml").read_text()
          assert 'rust-version = "1.88"' in manifest
          print("Cargo generated all three requested security-patched versions:", expected)
          PY
          test "$(git diff --name-only)" = "apps/desktop/src-tauri/Cargo.lock"
          echo "Cargo.lock changed, scoped to generated lockfile:"
          git diff --stat -- apps/desktop/src-tauri/Cargo.lock
      - name: Commit Cargo output and remove temporary write-capable workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-180-cargo-regeneration.yml
          git add apps/desktop/src-tauri/Cargo.lock .github/workflows/one-shot-180-cargo-regeneration.yml
          expected="$(printf '%s\n' '.github/workflows/one-shot-180-cargo-regeneration.yml' 'apps/desktop/src-tauri/Cargo.lock' | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): regenerate RustSec-patched Cargo.lock (#180) [skip ci]"
          git push origin HEAD:security/180-rustsec-patch-20261028
