name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan repository secrets
        run: npm run security:scan
      - name: Check core TypeScript
        id: core_typecheck
        shell: bash
        run: |
          set +e
          npm run check > core-typecheck.log 2>&1
          status=$?
          cat core-typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload core typecheck diagnostics
        if: steps.core_typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: core-typecheck-diagnostics
          path: core-typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce core TypeScript result
        if: steps.core_typecheck.outputs.status != '0'
        run: exit 1
      - name: Check desktop TypeScript
        id: desktop_typecheck
        shell: bash
        run: |
          set +e
          npm run desktop:web:check > desktop-typecheck.log 2>&1
          status=$?
          cat desktop-typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload desktop typecheck diagnostics
        if: steps.desktop_typecheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-typecheck-diagnostics
          path: desktop-typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce desktop TypeScript result
        if: steps.desktop_typecheck.outputs.status != '0'
        run: exit 1
      - name: Build and test
        id: build_test
        shell: bash
        run: |
          set +e
          npm test > build-test.log 2>&1
          status=$?
          cat build-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build and test diagnostics
        if: steps.build_test.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: build-test-diagnostics
          path: build-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce build and test result
        if: steps.build_test.outputs.status != '0'
        run: exit 1
