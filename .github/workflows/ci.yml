name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs (any branch) for diagnosing the cross-browser matrix.
  workflow_dispatch:
    inputs:
      probe_variants:
        description: "Restore/reload reproducer: regex over variant names (empty runs all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check repository viability
        id: viability
        shell: bash
        run: |
          set +e
          npm run viability:check > viability.log 2>&1
          status=$?
          cat viability.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload repository viability diagnostics
        if: steps.viability.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-viability-diagnostics
          path: viability.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce repository viability result
        if: steps.viability.outputs.status != '0'
        run: exit 1
      - name: Scan repository secrets
        id: secret_scan
        shell: bash
        run: |
          set +e
          npm run security:scan > secret-scan.log 2>&1
          status=$?
          cat secret-scan.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload secret scan diagnostics
        if: steps.secret_scan.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-diagnostics
          path: secret-scan.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce secret scan result
        if: steps.secret_scan.outputs.status != '0'
        run: exit 1
      - name: Scan reachable Git history for secrets
        id: history_secret_scan
        shell: bash
        run: |
          set +e
          npm run security:scan-history > history-secret-scan.log 2>&1
          status=$?
          cat history-secret-scan.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload historical secret scan diagnostics
        if: steps.history_secret_scan.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: historical-secret-scan-diagnostics
          path: history-secret-scan.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce historical secret scan result
        if: steps.history_secret_scan.outputs.status != '0'
        run: exit 1
      - name: Audit npm dependency graph
        id: dependency_audit
        shell: bash
        run: |
          set +e
          npm run security:audit > dependency-audit.log 2>&1
          status=$?
          cat dependency-audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency audit diagnostics
        if: steps.dependency_audit.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-diagnostics
          path: dependency-audit.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce dependency audit result
        if: steps.dependency_audit.outputs.status != '0'
        run: exit 1
      - name: Check core TypeScript
        id: core_typecheck
        shell: bash
        run: |
          set +e
          npm run check > core-typecheck.log 2>&1
          status=$?
          cat core-typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload core typecheck diagnostics
        if: steps.core_typecheck.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-typecheck-diagnostics
          path: core-typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce core TypeScript result
        if: steps.core_typecheck.outputs.status != '0'
        run: exit 1
      - name: Check desktop TypeScript
        id: desktop_typecheck
        shell: bash
        run: |
          set +e
          npm run desktop:web:check > desktop-typecheck.log 2>&1
          status=$?
          cat desktop-typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload desktop typecheck diagnostics
        if: steps.desktop_typecheck.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-typecheck-diagnostics
          path: desktop-typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce desktop TypeScript result
        if: steps.desktop_typecheck.outputs.status != '0'
        run: exit 1
      - name: Build, test, and report coverage
        id: build_test
        shell: bash
        run: |
          set +e
          npm run test:coverage > build-test.log 2>&1
          status=$?
          cat build-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build, test, and coverage diagnostics
        if: steps.build_test.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-test-diagnostics
          path: build-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce build, test, and coverage result
        if: steps.build_test.outputs.status != '0'
        run: exit 1
      - name: Build PWA and run real-browser smoke validation
        id: pwa_smoke
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set +e
          { npm run pwa:build && npm run pwa:smoke; } 2>&1 | tee pwa-smoke.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload PWA smoke diagnostics
        if: steps.pwa_smoke.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-smoke-diagnostics
          path: pwa-smoke.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce PWA smoke result
        if: steps.pwa_smoke.outputs.status != '0'
        run: exit 1
      - name: Validate portable backup migration between browser origins
        id: pwa_origin_migration
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set +e
          npm run pwa:origin-migration 2>&1 | tee pwa-origin-migration.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload PWA origin migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-origin-migration
          path: |
            pwa-origin-migration-report.json
            pwa-origin-migration.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce PWA origin migration result
        if: steps.pwa_origin_migration.outputs.status != '0'
        run: exit 1
      - name: Upload chromium capability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-smoke-chromium
          path: pwa-smoke-report-chromium.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload PWA build for provenance review
        if: steps.pwa_smoke.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: viable-pwa-${{ github.sha }}
          path: dist-pwa/
          if-no-files-found: error
          retention-days: 14

  pwa-cross-browser:
    # Real-browser PWA validation in Firefox and WebKit (Safari's engine) with
    # Playwright's matched engine builds. Chromium runs in the validate job on
    # every pull request; this heavier matrix runs automatically on main, on
    # manual dispatch, and on this cross-browser implementation branch so its
    # diagnostic/control changes are exact-head validated before merge.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'pwa/cross-browser-reload-fix')
    runs-on: ubuntu-latest
    # Manual runs also execute the restore/reload reproducer below.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }} engine
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Build PWA and run ${{ matrix.browser }} smoke validation
        id: smoke
        shell: bash
        # Bounded below the job timeout so the log and report still upload.
        timeout-minutes: 12
        env:
          PWA_BROWSER: ${{ matrix.browser }}
        run: |
          set +e
          # tee streams progress live, so even a hung run leaves a usable log.
          { npm run pwa:build && npm run pwa:smoke; } 2>&1 | tee pwa-smoke-${{ matrix.browser }}.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run ${{ matrix.browser }} restore/reload reproducer (diagnostic)
        # Manual runs only: isolates each step of the restore -> reload
        # sequence that crashed Playwright's Linux WebKit renderer (#124).
        # Diagnostic evidence, never a gate. Firefox passes the smoke, so the
        # reproducer runs for WebKit only.
        if: github.event_name == 'workflow_dispatch' && matrix.browser == 'webkit'
        timeout-minutes: 25
        continue-on-error: true
        env:
          PWA_BROWSER: ${{ matrix.browser }}
          PROBE_VARIANTS: ${{ inputs.probe_variants }}
        run: node scripts/pwa-restore-reload-probe.mjs 2>&1 | tee pwa-restore-reload-probe-${{ matrix.browser }}.log
      - name: Upload ${{ matrix.browser }} capability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pwa-smoke-${{ matrix.browser }}
          path: |
            pwa-smoke-report-${{ matrix.browser }}.json
            pwa-smoke-${{ matrix.browser }}.log
            pwa-restore-reload-probe-${{ matrix.browser }}.json
            pwa-restore-reload-probe-${{ matrix.browser }}.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce supported/candidate browser smoke result
        if: steps.smoke.outputs.status != '0' && matrix.browser == 'firefox'
        run: exit 1
      - name: Record experimental WebKit smoke limitation
        if: steps.smoke.outputs.status != '0' && matrix.browser == 'webkit'
        run: echo "::warning::Experimental WebKit smoke failed; capability evidence was uploaded. Safari/WebKit remains unsupported pending real-Safari validation."
