name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan repository secrets
        run: npm run security:scan
      - name: Check core TypeScript
        run: npm run check
      - name: Check desktop TypeScript
        run: npm run desktop:web:check
      - name: Build and test
        run: npm test
