name: Correct Campaign materialization product state

on:
  push:
    branches: [issue-5/signal-campaign-materialization]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-5/signal-campaign-materialization
      - name: Correct exact optional property state
        run: sed -i 's/private product?: ProductWorkspace;/private product: ProductWorkspace | undefined;/' apps/desktop/ui/signals-view.ts
      - name: Persist correction and remove temporary workflow
        run: |
          rm .github/workflows/fix-signal-campaign-product-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/signals-view.ts .github/workflows/fix-signal-campaign-product-state.yml
          git commit -m "Correct Campaign materialization Product state type"
          git push
